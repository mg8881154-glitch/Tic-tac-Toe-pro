<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li>🎮 Tic Tac Toe</li>
      </ul>
      <div class="nav-controls">
        <button id="darkToggle">🌙 Dark Mode</button>
        <button id="muteBtn">🔊 Sound</button>
      </div>
    </nav>

    <!-- Player Name Modal -->
    <div class="modal-overlay" id="nameModal">
      <div class="modal">
        <h2>Enter Player Names</h2>
        <input type="text" id="player1Name" placeholder="Player X name" maxlength="12" />
        <input type="text" id="player2Name" placeholder="Player O name" maxlength="12" />
        <div class="modal-btns">
          <button id="vsHuman">👥 2 Players</button>
          <button id="vsAI">🤖 vs Computer</button>
        </div>
      </div>
    </div>

    <div class="gameContainer">
      <div class="container">
        <div class="box bt-0 bl-0"><span class="boxtext"></span></div>
        <div class="box bt-0"><span class="boxtext"></span></div>
        <div class="box bt-0 br-0"><span class="boxtext"></span></div>
        <div class="box bl-0"><span class="boxtext"></span></div>
        <div class="box"><span class="boxtext"></span></div>
        <div class="box br-0"><span class="boxtext"></span></div>
        <div class="box bl-0 bt-0 bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0"><span class="boxtext"></span></div>
        <div class="box bb-0 br-0"><span class="boxtext"></span></div>
      </div>

      <div class="gameInfo">
        <h1>Welcome to Tic Tac Toe</h1>

        <!-- Score Board -->
        <div class="scoreboard">
          <div class="score-card" id="scoreX">
            <span class="score-name" id="nameX">Player X</span>
            <span class="score-val" id="scoreXval">0</span>
          </div>
          <div class="score-card draws">
            <span class="score-name">Draws</span>
            <span class="score-val" id="scoreDrawval">0</span>
          </div>
          <div class="score-card" id="scoreO">
            <span class="score-name" id="nameO">Player O</span>
            <span class="score-val" id="scoreOval">0</span>
          </div>
        </div>

        <div class="btn-row">
          <span class="info">Turn For X</span>
          <button id="undoBtn">↩ Undo</button>
          <button id="reset">Reset</button>
        </div>

        <div class="imgbox">
          <img src="excited.gif" alt="" />
          <div class="sad-emoji">😢</div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="foot">
        <span>Made with ♥️ Muskan Gupta 2026</span>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
